name: Apply Android Auto Checked Edit

on:
  push:
    branches: [feat/android-auto-full]
    paths:
      - 'tools/apply_android_auto_service.py'

permissions:
  contents: write

jobs:
  apply-edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-auto-full
          fetch-depth: 0
      - name: Apply assertion-checked Android Auto edit
        run: python tools/apply_android_auto_service.py
      - name: Commit Android Auto catalog edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/AndroidAutoCatalog.kt
          git commit -m "perf(auto): run mixed search filters concurrently"
          git push origin HEAD:feat/android-auto-full
