name: Apply Kona Feedback Fixes

on:
  push:
    branches:
      - integration/bitChord-android-auto-2026-09

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'feat(auto): fix Kona library and richer Home')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/bitChord-android-auto-2026-09

      - name: Apply tested production fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          catalog = "app/src/main/java/com/music/bitchord/playback/AndroidAutoCatalog.kt"
          replace_exact(
              catalog,
              "import androidx.media3.common.MediaMetadata\nimport com.music.bitchord.data.YtMusicRepository\n",
              "import androidx.media3.common.MediaMetadata\nimport com.music.bitchord.BuildConfig\nimport com.music.bitchord.R\nimport com.music.bitchord.data.YtMusicRepository\n",
          )

          replace_exact(
              catalog,
              '''            AndroidAutoRoute.Home -> browsable(route, "Home")
            AndroidAutoRoute.Explore -> browsable(route, "Explore")
            AndroidAutoRoute.Recent -> browsable(route, "Recently Played")
            AndroidAutoRoute.Library -> browsable(route, "Library")
            AndroidAutoRoute.LocalMusic -> browsable(route, "Local Music")
            is AndroidAutoRoute.LocalSection -> browsable(route, localSectionTitle(route.section))
            is AndroidAutoRoute.LibrarySection -> browsable(route, librarySectionTitle(route.section))
''',
              '''            AndroidAutoRoute.Home -> browsable(route, "Home", artwork = resourceArtwork(R.drawable.ic_car_home))
            AndroidAutoRoute.Explore -> browsable(route, "Browse", artwork = resourceArtwork(R.drawable.ic_car_browse))
            AndroidAutoRoute.Recent -> browsable(route, "Recents", artwork = resourceArtwork(R.drawable.ic_car_recents))
            AndroidAutoRoute.Library -> browsable(route, "Library", artwork = resourceArtwork(R.drawable.ic_car_library))
            AndroidAutoRoute.LocalMusic -> browsable(route, "Local Music", artwork = resourceArtwork(R.drawable.ic_car_local_music))
            is AndroidAutoRoute.LocalSection -> browsable(route, localSectionTitle(route.section), artwork = resourceArtwork(R.drawable.ic_car_local_music))
            is AndroidAutoRoute.LibrarySection -> browsable(route, librarySectionTitle(route.section), artwork = resourceArtwork(R.drawable.ic_car_library))
''',
          )

          replace_exact(
              catalog,
              '''    private fun rootChildren(): List<MediaItem> = listOf(
        browsable(AndroidAutoRoute.Home, "Home"),
        browsable(AndroidAutoRoute.Explore, "Explore"),
        browsable(AndroidAutoRoute.Recent, "Recently Played"),
        browsable(AndroidAutoRoute.Library, "Library"),
    )

    private suspend fun homeFeed(): HomeFeed {
        homeCache?.takeIf { nowMs() - it.storedAt <= HOME_TTL_MS }?.let { return it.value }
        return dataSource.home().getOrThrow().also { homeCache = CacheEntry(it, nowMs()) }
    }
''',
              '''    private fun rootChildren(): List<MediaItem> = listOf(
        browsable(AndroidAutoRoute.Home, "Home", artwork = resourceArtwork(R.drawable.ic_car_home)),
        browsable(AndroidAutoRoute.Recent, "Recents", artwork = resourceArtwork(R.drawable.ic_car_recents)),
        browsable(AndroidAutoRoute.Explore, "Browse", artwork = resourceArtwork(R.drawable.ic_car_browse)),
        browsable(AndroidAutoRoute.Library, "Library", artwork = resourceArtwork(R.drawable.ic_car_library)),
    )

    private suspend fun homeFeed(): HomeFeed {
        homeCache?.takeIf { nowMs() - it.storedAt <= HOME_TTL_MS }?.let { return it.value }

        val first = dataSource.home().getOrThrow()
        val shelves = first.shelves.toMutableList()
        var continuation = first.continuation
        repeat(MAX_HOME_CONTINUATIONS) {
            val token = continuation ?: return@repeat
            val next = dataSource.moreHome(token).getOrNull()
            if (next == null) {
                continuation = null
                return@repeat
            }
            shelves += next.shelves
            continuation = next.continuation
        }
        val richerFeed = HomeFeed(
            shelves = shelves.distinctBy { it.title.trim().lowercase() },
            continuation = continuation,
        )
        homeCache = CacheEntry(richerFeed, nowMs())
        return richerFeed
    }
''',
          )

          replace_exact(
              catalog,
              '''    private suspend fun libraryFolders(): List<MediaItem> = buildList {
        // Local Music is independent of YouTube authentication. A signed-out
        // driver can still browse and play the music already on the phone.
        val local = runCatching { localDataSource.catalog() }.getOrNull()
        if (local?.songs?.isNotEmpty() == true) {
            add(browsable(AndroidAutoRoute.LocalMusic, "Local Music"))
        }

        if (!dataSource.isSignedIn()) return@buildList
        val page = library()
        if (page.likedSongs.isNotEmpty()) {
            add(browsable(AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.LIKED), "Liked Songs"))
        }
        if (page.librarySongs.isNotEmpty()) {
            add(browsable(AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.SONGS), "Songs"))
        }
        LIBRARY_SHELVES.forEach { (section, title) ->
            if (page.shelves.firstOrNull { it.title.equals(title, ignoreCase = true) }?.items?.isNotEmpty() == true) {
                add(browsable(AndroidAutoRoute.LibrarySection(section), title))
            }
        }
    }
''',
              '''    private fun libraryFolders(): List<MediaItem> = buildList {
        // The car's Library landing page must be instant. Do not scan the phone
        // or fetch seven YouTube feeds just to decide which stable folders exist.
        add(
            browsable(
                AndroidAutoRoute.LocalMusic,
                "Local Music",
                artwork = resourceArtwork(R.drawable.ic_car_local_music),
            ),
        )

        if (!dataSource.isSignedIn()) return@buildList
        add(
            browsable(
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.LIKED),
                "Liked Songs",
                artwork = resourceArtwork(R.drawable.ic_car_library),
            ),
        )
        add(
            browsable(
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.SONGS),
                "Songs",
                artwork = resourceArtwork(R.drawable.ic_car_library),
            ),
        )
        LIBRARY_SHELVES.forEach { (section, title) ->
            add(
                browsable(
                    AndroidAutoRoute.LibrarySection(section),
                    title,
                    artwork = resourceArtwork(R.drawable.ic_car_library),
                ),
            )
        }
    }
''',
          )

          replace_exact(
              catalog,
              '''    private fun localSectionTitle(section: AndroidAutoLocalSection): String = when (section) {
''',
              '''    private fun resourceArtwork(resId: Int): String =
        "android.resource://${BuildConfig.APPLICATION_ID}/$resId"

    private fun localSectionTitle(section: AndroidAutoLocalSection): String = when (section) {
''',
          )

          replace_exact(
              catalog,
              '''        private const val HOME_TTL_MS = 5 * 60_000L
''',
              '''        private const val HOME_TTL_MS = 5 * 60_000L
        private const val MAX_HOME_CONTINUATIONS = 2
''',
          )

          test_path = "app/src/test/java/com/music/bitchord/AndroidAutoCatalogTest.kt"
          replace_exact(
              test_path,
              '''            listOf("Home", "Explore", "Recently Played", "Library"),
''',
              '''            listOf("Home", "Recents", "Browse", "Library"),
''',
          )
          replace_exact(
              test_path,
              '''    @Test
    fun libraryOnlyShowsNonEmptyCategories() = runBlocking {
        val playlist = ShelfItem("Road Trip", "Playlist", null, null, "VLPL-road")
        val fake = FakeAutoDataSource().apply {
            libraryResult = Result.success(
                LibraryPage(
                    likedSongs = listOf(song("liked")),
                    librarySongs = emptyList(),
                    shelves = listOf(HomeShelf("Playlists", listOf(playlist))),
                ),
            )
        }
        val catalog = AndroidAutoCatalog(fake)

        val folders = catalog.children(AndroidAutoRoute.Library, 0, 20).getOrThrow()
        assertEquals(listOf("Liked Songs", "Playlists"), folders.map { it.mediaMetadata.title.toString() })
        assertEquals(
            listOf(
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.LIKED),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.PLAYLISTS),
            ),
            folders.mapNotNull { AndroidAutoMediaIds.parse(it.mediaId) },
        )
    }
''',
              '''    @Test
    fun libraryRootIsStableAndDoesNotFetchNetwork() = runBlocking {
        val fake = FakeAutoDataSource()
        val catalog = AndroidAutoCatalog(fake)

        val folders = catalog.children(AndroidAutoRoute.Library, 0, 20).getOrThrow()
        assertEquals(
            listOf(
                "Local Music",
                "Liked Songs",
                "Songs",
                "Playlists",
                "Albums",
                "Artists",
                "Subscriptions",
                "Podcasts",
            ),
            folders.map { it.mediaMetadata.title.toString() },
        )
        assertEquals(0, fake.libraryCalls)
        assertEquals(
            listOf(
                AndroidAutoRoute.LocalMusic,
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.LIKED),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.SONGS),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.PLAYLISTS),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.ALBUMS),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.ARTISTS),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.SUBSCRIPTIONS),
                AndroidAutoRoute.LibrarySection(AndroidAutoLibrarySection.PODCASTS),
            ),
            folders.mapNotNull { AndroidAutoMediaIds.parse(it.mediaId) },
        )
    }
''',
          )

          real_car = "app/src/test/java/com/music/bitchord/AndroidAutoRealCarFeedbackTest.kt"
          replace_exact(
              real_car,
              '''    @Test
    fun androidAutoDataSourceExposesHomeContinuationApi() {
        assertTrue(
            AndroidAutoDataSource::class.java.methods.any { method -> method.name == "moreHome" },
        )
    }
''',
              '''    @Test
    fun androidAutoDataSourceExposesHomeContinuationApi() = runBlocking {
        val source: AndroidAutoDataSource = OnlineSource().apply {
            continuationResults["contract"] = Result.success(
                HomeFeed(listOf(shelf("Contract", "contract")), null),
            )
        }
        assertEquals("Contract", source.moreHome("contract").getOrThrow().shelves.single().title)
    }
''',
          )

          for android_test in [
              "app/src/androidTest/java/com/music/bitchord/AndroidAutoMediaLibraryTest.kt",
              "app/src/androidTest/java/com/music/bitchord/AndroidAutoLegacyBrowserTest.kt",
          ]:
              replace_exact(
                  android_test,
                  '''            listOf("Home", "Explore", "Recently Played", "Library"),
''',
                  '''            listOf("Home", "Recents", "Browse", "Library"),
''',
              )
          PY

      - name: Commit fix batch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/AndroidAutoCatalog.kt \
                  app/src/test/java/com/music/bitchord/AndroidAutoCatalogTest.kt \
                  app/src/test/java/com/music/bitchord/AndroidAutoRealCarFeedbackTest.kt \
                  app/src/androidTest/java/com/music/bitchord/AndroidAutoMediaLibraryTest.kt \
                  app/src/androidTest/java/com/music/bitchord/AndroidAutoLegacyBrowserTest.kt
          git commit -m "feat(auto): fix Kona library and richer Home [skip apply-real-car]"
          git push origin HEAD:integration/bitChord-android-auto-2026-09
