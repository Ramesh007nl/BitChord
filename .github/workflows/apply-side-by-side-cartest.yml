name: Apply Side-by-Side Car Test Identity

on:
  push:
    branches:
      - test/tantov-cartest-side-by-side

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tantov-cartest-side-by-side

      - name: Apply separate test package and label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text()
          old = '''        create("dev") {
            dimension = "env"
            applicationId = "com.tantov.music"
            resValue("string", "app_name", "TanTov Music")
        }
'''
          new = '''        create("dev") {
            dimension = "env"
            // Side-by-side real-car test build: never replaces the user's existing TanTov install.
            applicationId = "com.tantov.music.cartest"
            resValue("string", "app_name", "TanTov Music Test")
        }
'''
          if old not in text:
              raise SystemExit('Expected dev flavor block not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Commit identity change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "build(test): use side-by-side car test identity"
          git push origin HEAD:test/tantov-cartest-side-by-side
