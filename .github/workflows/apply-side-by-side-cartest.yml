name: Apply Side-by-Side Car Test Identity

on:
  push:
    branches:
      - test/tantov-cartest-side-by-side

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tantov-cartest-side-by-side

      - name: Apply separate test package and label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text()
          old_id = '            applicationId = "com.tantov.music"'
          old_name = '            resValue("string", "app_name", "TanTov Music")'
          if old_id not in text or old_name not in text:
              raise SystemExit('Expected dev flavor identity not found')
          text = text.replace(old_id, '            applicationId = "com.tantov.music.cartest"', 1)
          text = text.replace(old_name, '            resValue("string", "app_name", "TanTov Music Test")', 1)
          p.write_text(text)
          PY

      - name: Commit identity change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "build(test): use side-by-side car test identity"
          git push origin HEAD:test/tantov-cartest-side-by-side
