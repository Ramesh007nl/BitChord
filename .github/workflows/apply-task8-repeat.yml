name: Apply Task 8 Repeat Patch

on:
  push:
    branches: [feat/tantov-music-v1]
    paths: [.github/workflows/apply-task8-repeat.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tantov-music-v1
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Apply Task 8 patch
        run: python3 tools/apply_task8_repeat.py
      - name: Verify repeat RED-to-GREEN target
        run: ./gradlew testDevDebugUnitTest --tests com.music.bitchord.AndroidAutoRepeatCommandTest
      - name: Commit Task 8 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/playback/PlaybackService.kt \
                  app/src/main/java/com/music/bitchord/MainActivity.kt \
                  .github/workflows/android-auto-legacy-smoke.yml
          git diff --cached --check
          git commit -m "feat(auto): add repeat mode control"
          git push origin HEAD:feat/tantov-music-v1
