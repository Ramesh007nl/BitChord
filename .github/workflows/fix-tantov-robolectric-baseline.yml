name: Fix TanTov Robolectric Baseline

on:
  push:
    branches: [integration/bitChord-android-auto-2026-09]
    paths:
      - 'tools/fix_tantov_robolectric_baseline.py'
      - '.github/workflows/fix-tantov-robolectric-baseline.yml'

permissions:
  contents: write

jobs:
  fix-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/bitChord-android-auto-2026-09
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: chmod +x gradlew
      - name: Apply minimal dependency fix
        run: python tools/fix_tantov_robolectric_baseline.py
      - name: Verify unit-test baseline
        run: ./gradlew testDevDebugUnitTest
      - name: Commit verified baseline fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle.kts
          git commit -m 'fix(test): add Robolectric for car template tests'
          git push origin HEAD:integration/bitChord-android-auto-2026-09
